name: Monitor Concorsi

on:
  schedule:
    # Esegui ogni giorno alle 9:00 UTC
    - cron: '0 9 * * *'
  workflow_dispatch:

# Serve per committare seen_bandi.json aggiornato
permissions:
  contents: write

concurrency:
  group: monitor-concorsi
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps
      
      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROFILO: ${{ secrets.PROFILO }}
          # Metti "true" per ricevere su Telegram anche gli errori tecnici
          NOTIFY_ERRORS: ${{ vars.NOTIFY_ERRORS || 'false' }}
        run: python main.py

      - name: Commit and push seen_bandi.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_bandi.json
          git diff --staged --quiet || {
            git commit -m "Aggiorna seen_bandi.json [skip ci]"
            git pull --rebase --autostash
            git push
          }